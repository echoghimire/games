<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · Tronix Arena</title>
    <meta name="description" content="Fast, old-school multiplayer shooter that runs in your browser. No install." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body data-page="login">
    <header class="bar">
      <a class="brand" href="/"><img class="brand-logo" src="/logo.svg" alt="" />TRONIX<span>ARENA</span></a>
      <nav id="nav"><a href="/login">Log in</a><a class="btn small" href="/signup">Sign up</a></nav>
    </header>
    <main class="narrow">
      <h1>Welcome back</h1>
      <form id="auth-form" class="panel">
        <label>Email <input name="email" type="email" required autocomplete="email" /></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password" /></label>
        <p class="error" id="error" hidden></p>
        <button class="btn">Log in</button>
        <p class="muted">New here? <a href="/signup">Sign up</a></p>
      </form>
    </main>
    <footer class="credits">
      Built on <a href="https://github.com/cloudflare/doom-wasm">Chocolate Doom / doom-wasm</a> (GPL-2.0, <a href="https://github.com/echoghimire/games">source</a>)
      and <a href="https://freedoom.github.io/">Freedoom</a> game data (BSD). Iron Arena © Andrea Acanfora, used with permission. <a href="/licenses">Licenses</a>. Not affiliated with id Software.
    </footer>
    <script src="/landing.js" type="module"></script>
  </body>
</html>
